# The gate: every suite on every push. `npm run acceptance` stays manual —
# it spends a real claude turn and needs credentials.
#
# windows-latest keeps the win32 paths honest (WSL wrap in electron/wsl.js).
# There is no node-pty in this repo, so the ConPTY rebuild named in #397 is
# a no-op — do not add a rebuild step. Most of the electron suite still
# cannot run on win32 (shebang fakes); scripts/test-electron.js skips those
# and runs the WSL contract only. Winget is blocked on an installer — see
# the note in scripts/package-cross.sh.
#
# ubuntu-latest is the Linux proof (#455). Linux is POSIX, so the full
# electron glob runs — no third skip list. The smoke job is NOT one line:
# Electron needs a display and the Ubuntu runner has none, so xvfb-run
# wraps `npm run test:smoke` there only. scripts/test-smoke.js also
# passes --no-sandbox on Linux (Chromium aborts as root / without a
# setuid chrome-sandbox before any JS runs).
#
# `smoke` is a separate job on purpose: a boot/dispatch failure must show
# up as a boot failure, not a needle inside `npm test`. It is the first
# thing in CI that actually starts the app on each OS (#449, #455).
#
# The `test` job also runs `npx vite build` (#646). Renderer tests stub
# CSS modules (test/support/render-hooks.mjs), so an unclosed block like
# the `.cliWarning` that sat on main for a day never fails `npm test`.
name: test

on: push

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Healthy runs finish in about 6 minutes (Ubuntu) to 10 (macOS).
    # The 2026-09-23 windows-latest job had no timeout, stopped emitting
    # electron TAP after cursor.test.js, and was canceled at GitHub's
    # 6-hour default. 25 minutes fails that hang. It does not skip tests.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # Sitemap freshness checks need the actual last HTML edit, not the
          # shallow boundary's unrelated commit date.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - uses: ./.github/actions/npm-ci-electron
      - name: Check generated marketing site
        if: runner.os == 'Linux'
        run: |
          npm run build:site
          git diff --exit-code -- site
      - run: npm ci --prefix core
      # ONNX Runtime 1.21.0 otherwise downloads CUDA on Linux x64 even without
      # nvcc. These CPU-only tests keep the bundled CPU runtime and all suites.
      - run: npm ci --prefix memory-server --onnxruntime-node-install-cuda=skip
      - run: npx vite build
      - name: Install Codex for the Linux git sandbox proof
        if: runner.os == 'Linux'
        run: npm install --global @openai/codex@0.153.4
      # Ubuntu 24.04 sets kernel.apparmor_restrict_unprivileged_userns=1.
      # Unprivileged bwrap then dies in loopback setup
      # (`RTM_NEWADDR: Operation not permitted`) before git runs.
      # Codex 0.153.4 execs /usr/bin/bwrap (strace). A vendored
      # codex-resources/bwrap exists and was not the process that ran.
      # bwrap-userns-restrict allows that binary a user namespace and
      # denies capability to its children. The sysctl stays 1 for every
      # other program. The codex sandbox probe below fails the job if
      # Codex stops calling this binary and the real sandbox still cannot
      # start. It does not switch Codex onto Landlock.
      - name: Allow bubblewrap user namespaces for the Codex sandbox proof
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y apparmor apparmor-profiles bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null | grep -qx 1; then
            # 24.04 ships the profile under extra-profiles; the 26.04 runner
            # image (apparmor-profiles 5.0.2) no longer does. Use whichever
            # bwrap profile the image has.
            profile=""
            for p in /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
                     /etc/apparmor.d/bwrap-userns-restrict; do
              if [ -f "$p" ]; then profile="$p"; break; fi
            done
            if [ -z "$profile" ]; then
              profile="$(find /usr/share/apparmor /etc/apparmor.d -type f -name 'bwrap*' 2>/dev/null | head -n 1 || true)"
            fi
            if [ -n "$profile" ]; then
              echo "Using AppArmor profile $profile"
              if [ "$profile" != /etc/apparmor.d/bwrap-userns-restrict ]; then
                sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
              fi
              sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
            else
              # Last resort, this CI job only: the probe below still fails
              # the job if the real sandbox cannot start.
              echo "::warning::No bwrap AppArmor profile on this runner image; allowing unprivileged user namespaces for this job"
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-net /bin/true
          probe="${HOME}/.cache/solenta-codex-bwrap-probe"
          rm -rf "$probe"
          mkdir -p "$probe"
          cd "$probe"
          # Codex 0.153.4 errors when this path is missing (job 108204293686).
          mkdir -p "${HOME}/.cache/solenta-codex-home"
          CODEX_HOME="${HOME}/.cache/solenta-codex-home" \
            codex sandbox -c sandbox_mode=workspace-write -- /bin/true
      - run: npm test

  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - uses: ./.github/actions/npm-ci-electron
      - run: npm ci --prefix core
      - run: npm run build --prefix core
      - run: npx vite build
      - name: Install xvfb
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2
          libgtk-3-0 libgbm1 libasound2t64 libxcomposite1 libxdamage1
          libxfixes3 libxrandr2 libxkbcommon0
      - name: Smoke
        if: runner.os != 'Linux'
        run: npm run test:smoke
      - name: Smoke
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:smoke

  # #1849: Linux --headless with no DISPLAY/WAYLAND_DISPLAY must boot, serve
  # and stop cleanly. main.js relaunches itself with --ozone-platform=headless
  # (the ozone leg, which must not start Xvfb) and falls back to xvfb-run if
  # that child fails within 5 s (the xvfb leg runs that fallback command).
  # The #1847 no-tray rule is under test in both.
  headless-linux:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        display: [ozone, xvfb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - uses: ./.github/actions/npm-ci-electron
      - run: npm ci --prefix core
      # Headless boot uses CPU memory embeddings; no CUDA EP is exercised.
      # Keep this local to CI, not production/server-bundle dependency installs.
      - run: npm ci --prefix memory-server --onnxruntime-node-install-cuda=skip
      - run: npm run build --prefix core
      - run: npx vite build
      - name: Install Electron runtime libs
        run: >
          sudo apt-get update && sudo apt-get install -y
          ${{ matrix.display == 'xvfb' && 'xvfb' || '' }}
          libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2
          libgtk-3-0 libgbm1 libasound2t64 libxcomposite1 libxdamage1
          libxfixes3 libxrandr2 libxkbcommon0
      - name: Boot --headless with no display (${{ matrix.display }})
        env:
          WRAP: ${{ matrix.display == 'xvfb' && 'xvfb-run -a' || '' }}
        run: |
          set -u
          home="$(mktemp -d)"
          log="$RUNNER_TEMP/headless.log"
          # setsid: one process group, so the cleanup kill also reaps helpers and Xvfb.
          setsid env -u DISPLAY -u WAYLAND_DISPLAY -u XDG_CONFIG_HOME HOME="$home" \
            $WRAP "$(node -p 'require("electron")')" . --headless --serve-web=4620 --no-sandbox \
            >"$log" 2>&1 &
          pid=$!
          sleep 8
          ok=1
          kill -0 "$pid" 2>/dev/null || { echo "::error::solenta --headless exited within 8 s"; ok=0; }
          if [ "$ok" = 1 ]; then
            curl -sf -o /dev/null --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:4620/ \
              || { echo "::error::nothing answered on 127.0.0.1:4620"; ok=0; }
          fi
          echo "Xvfb processes:"
          if pgrep -a Xvfb; then xvfb=1; else echo "(none)"; xvfb=0; fi
          if [ "${{ matrix.display }}" = xvfb ] && [ "$xvfb" = 0 ]; then echo "::error::xvfb-run started no Xvfb"; ok=0; fi
          if [ "${{ matrix.display }}" = ozone ] && [ "$xvfb" = 1 ]; then echo "::error::fell back to xvfb-run; the ozone child failed"; ok=0; fi
          # Stop like `kill <server pid>`: SIGTERM only the Electron main process,
          # the child of the relaunching parent or of xvfb-run. A group SIGTERM
          # races Chromium's helper processes and FATALs. $pid exits with its status.
          main="$(pgrep -P "$pid" -f -- --serve-web=4620 | head -n 1)"
          [ -n "$main" ] || { echo "::error::no relaunched Electron main process under $pid"; ok=0; main="$pid"; }
          kill "$main" 2>/dev/null || true
          for _ in $(seq 15); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          # bash -e: a crashed child must not end the step before the log.
          kill -- -"$pid" 2>/dev/null || true; status=0; wait "$pid" 2>/dev/null || status=$?
          echo "exit status after SIGTERM to main: $status"
          [ "$status" = 0 ] || { echo "::error::did not exit cleanly on SIGTERM"; ok=0; }
          echo "::group::solenta log"; cat "$log"; echo "::endgroup::"
          [ "$ok" = 1 ]
