# The gate: every suite on every push. `npm run acceptance` stays manual —
# it spends a real claude turn and needs credentials.
#
# windows-latest keeps the win32 paths honest (WSL wrap in electron/wsl.js).
# There is no node-pty in this repo, so the ConPTY rebuild named in #397 is
# a no-op — do not add a rebuild step. Most of the electron suite still
# cannot run on win32 (shebang fakes); scripts/test-electron.js skips those
# and runs the WSL contract only. Winget is blocked on an installer — see
# the note in scripts/package-cross.sh.
#
# ubuntu-latest is the Linux proof (#455). Linux is POSIX, so the full
# electron glob runs — no third skip list. The smoke job is NOT one line:
# Electron needs a display and the Ubuntu runner has none, so xvfb-run
# wraps `npm run test:smoke` there only. scripts/test-smoke.js also
# passes --no-sandbox on Linux (Chromium aborts as root / without a
# setuid chrome-sandbox before any JS runs).
#
# `smoke` is a separate job on purpose: a boot/dispatch failure must show
# up as a boot failure, not a needle inside `npm test`. It is the first
# thing in CI that actually starts the app on each OS (#449, #455).
#
# The `test` job also runs `npx vite build` (#646). Renderer tests stub
# CSS modules (test/support/render-hooks.mjs), so an unclosed block like
# the `.cliWarning` that sat on main for a day never fails `npm test`.
name: test

on: push

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Healthy runs finish in about 6 minutes (Ubuntu) to 10 (macOS).
    # The 2026-09-23 windows-latest job had no timeout, stopped emitting
    # electron TAP after cursor.test.js, and was canceled at GitHub's
    # 6-hour default. 25 minutes fails that hang. It does not skip tests.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci
      - run: npm ci --prefix core
      - run: npm ci --prefix memory-server
      - run: npx vite build
      - name: Install Codex for the Linux git sandbox proof
        if: runner.os == 'Linux'
        run: npm install --global @openai/codex@0.153.4
      # Ubuntu 24.04 sets kernel.apparmor_restrict_unprivileged_userns=1.
      # Unprivileged bwrap then dies in loopback setup
      # (`RTM_NEWADDR: Operation not permitted`) before git runs.
      # Codex 0.153.4 execs /usr/bin/bwrap (strace). A vendored
      # codex-resources/bwrap exists and was not the process that ran.
      # bwrap-userns-restrict allows that binary a user namespace and
      # denies capability to its children. The sysctl stays 1 for every
      # other program. The codex sandbox probe below fails the job if
      # Codex stops calling this binary and the real sandbox still cannot
      # start. It does not switch Codex onto Landlock.
      - name: Allow bubblewrap user namespaces for the Codex sandbox proof
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y apparmor apparmor-profiles bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null | grep -qx 1; then
            sudo install -m 0644 \
              /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-net /bin/true
          probe="${HOME}/.cache/solenta-codex-bwrap-probe"
          rm -rf "$probe"
          mkdir -p "$probe"
          cd "$probe"
          CODEX_HOME="${HOME}/.cache/solenta-codex-home" \
            codex sandbox -c sandbox_mode=workspace-write -- /bin/true
      - run: npm test

  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci
      - run: npm ci --prefix core
      - run: npm run build --prefix core
      - run: npx vite build
      - name: Install xvfb
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2
          libgtk-3-0 libgbm1 libasound2t64 libxcomposite1 libxdamage1
          libxfixes3 libxrandr2 libxkbcommon0
      - name: Smoke
        if: runner.os != 'Linux'
        run: npm run test:smoke
      - name: Smoke
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:smoke
