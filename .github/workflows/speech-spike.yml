# Throwaway #845 live STT spike on native ubuntu-latest / windows-latest.
# Not a product gate. Delete after Linux/Windows numbers are recorded.
name: speech-spike

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-live:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make cache dir
        env:
          SPIKE_CACHE: ${{ runner.temp }}/speech-spike
        run: node -e "require('fs').mkdirSync(process.env.SPIKE_CACHE + '/gguf', {recursive:true})"
      - name: Cache GGUF
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/speech-spike/gguf/nemotron-speech-streaming-en-0.6b.q8_0.gguf
          key: gguf-d9a01898d2a611c8764e23a1c2f45e70bbd5a425dc4de93692ac951dd603812d
      - name: Live CPU gates
        env:
          SPIKE_CACHE: ${{ runner.temp }}/speech-spike
        run: node spike/speech/ci-run.mjs
