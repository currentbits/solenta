<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex" />
  <title>Solenta OG card</title>
  <style>
    @font-face {
      font-family: "Geist";
      src: url("fonts/Geist-Variable.woff2") format("woff2");
      font-weight: 100 900;
      font-display: block;
    }
    @font-face {
      font-family: "Geist Mono";
      src: url("fonts/GeistMono-Variable.woff2") format("woff2");
      font-weight: 100 900;
      font-display: block;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #f5f5f2;
      color: #191918;
      font-family: "Geist", -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      font-synthesis: none;
    }

    /* Same paper-and-ink language as solenta.app: one yellow accent, dark
       surfaces only as the product screenshot. */
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #f5f5f2;
    }

    .copy {
      position: absolute;
      left: 72px;
      top: 0;
      bottom: 0;
      width: 480px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 34px;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      flex: none;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    h1 {
      font-size: 62px;
      font-weight: 650;
      letter-spacing: -0.045em;
      line-height: 1.02;
      margin: 0 0 26px;
    }
    .em {
      padding: 0 0.06em;
      background-image: linear-gradient(#f2e51f, #f2e51f);
      background-repeat: no-repeat;
      background-size: 100% 44%;
      background-position: 0 82%;
    }

    .sub {
      font-size: 20px;
      font-weight: 500;
      line-height: 1.35;
      color: #5d5d58;
      margin: 0 0 40px;
      max-width: 30ch;
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 13px;
      font-weight: 500;
    }
    .providers { color: #8f8f89; letter-spacing: 0.01em; }
    .url { color: #191918; }

    .shot {
      position: absolute;
      right: -96px;
      top: 92px;
      width: 720px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(25, 25, 24, 0.24);
      box-shadow: 0 24px 60px rgba(25, 25, 24, 0.16);
      z-index: 1;
    }
    .shot img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="copy">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50 8 L92 50 L50 92 L8 50 Z" fill="none" stroke="#191918" stroke-width="10" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">Solenta</span>
      </div>
      <h1>Your agents <span class="em">remember</span>.</h1>
      <p class="sub">Shared memory and a GitHub-native planboard for every coding agent.</p>
      <div class="meta">
        <div class="providers">Claude · Codex · Kimi · Grok · OpenCode</div>
        <div class="url">solenta.app</div>
      </div>
    </div>

    <div class="shot">
      <img src="assets/screen-main.png" alt="" />
    </div>
  </div>
</body>
</html>
