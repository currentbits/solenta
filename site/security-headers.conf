# Report-only until the owner approves enforcement after observing production.
# api.github.com is used by main.js for current download URLs.
# unpkg serves both the Phosphor stylesheet and its icon font.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://app.meterbird.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' https://unpkg.com; img-src 'self' data: https://cdn.simpleicons.org https://verifieddr.com https://nicklaunches.com https://app.meterbird.com; connect-src 'self' https://api.github.com https://stats.solenta.app https://app.meterbird.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
