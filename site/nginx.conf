server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript text/plain;
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json application/xml text/plain image/svg+xml;
    include /etc/nginx/snippets/seo-headers.conf;

    # Deploy files are not a public surface.
    location = /Dockerfile { return 404; }
    location = /nginx.conf { return 404; }
    location = /security-headers.conf { return 404; }
    location = /index.html { return 301 /; }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
        include /etc/nginx/snippets/seo-headers.conf;
    }

    # Clean URLs: redirect /docs and /changelog to their .html files (301)
    # so crawlers index the canonical .html path.
    location = /docs { return 301 /docs.html; }
    location = /changelog { return 301 /changelog.html; }

    # Topic directories also work on the GitHub Pages mirror. The primary
    # site serves their canonical clean URL without a directory redirect.
    location ~ ^/(docs|guides|compare|alternatives)/([a-z0-9-]+)/(?:index\.html)?$ {
        return 301 /$1/$2$is_args$args;
    }
    location ~ ^/(docs|guides|compare|alternatives)/([a-z0-9-]+)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/snippets/seo-headers.conf;
        try_files $uri/index.html =404;
    }

    # HTML must not sit in a stale edge/crawler cache — the homepage
    # card was stuck on the original relative og:image for this reason.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/snippets/seo-headers.conf;
    }

    location = / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/snippets/seo-headers.conf;
        try_files /index.html =404;
    }

    # The page shell changes in place on deploy. Revalidate it instead of
    # letting the Cloudflare default keep old JS/CSS for hours.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/snippets/seo-headers.conf;
    }

    # Rename a font file when replacing its contents.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/seo-headers.conf;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/seo-headers.conf;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
